baseURL = "https://electricgerbil.art/"
languageCode = "en-US"
title = "Electric Gerbil Arts"
# Enable comments by entering your Disqus shortname
disqusShortname = ""
# Enable Google Analytics by entering your tracking code
googleAnalytics = "G-550TQB4CNE"
enableRobotsTXT = true
disableFastRender = true

theme = ["hugo-video","electric-gerbil"]

[build]
  writeStats = false

[markup.goldmark.renderer]
  unsafe = true

[permalinks]
  post = "/:year/:month/:day/:slug"

[params]
  avatar = "/images/electric-gerbil-logo.webp"
  author = "Electric Gerbil Arts"
  description = "Electric Gerbil is immersive LED artwork by Jim Cortez."
  footer_copyright = "Jim Cortez. All rights reserved."

  # Custom assets can be linked with their paths relative to static/
  custom_css = ["css/electric-gerbil.css", "css/carousel.css"]
  custom_js  = ["js/carousel.js"]

  # flip this for localhost debugging
  httpsOnly  = false

[params.social]
  Instagram     = "electricgerbil"
  Github        = "jimcortez"
  Email         = ""
  Twitter       = ""
  LinkedIn      = ""
  Stackoverflow = ""
  Medium        = ""
  Telegram      = ""
  RSS           = ""

[params.homepage]
  featured_page = "/art/commune"

# ## Main Menu
[[menu.main]]
  name = "About the Artist"
  identifier = "about"
  weight = 100
  url = "/about/"

[params.csp]
  # Sources actually used by the site:
  #   styles  -> self + fonts.googleapis.com (Outfit)
  #   fonts   -> fonts.gstatic.com (Outfit woff2)
  #   scripts -> self + Google Tag Manager (loads gtag.js)
  #   xhr     -> Google Analytics collect endpoint
  #   frames  -> www.youtube.com (project page video embeds)
  # 'unsafe-inline' is for the inline gtag bootstrap; 'unsafe-eval' is for gtag.js itself.
  # *.electricgerbil.art is kept as a forward-compat slot for a future asset subdomain.
  childsrc = ["'self'"]
  fontsrc = ["'self'",
             "https://*.electricgerbil.art/",
             "https://fonts.gstatic.com",
             "data:"]
  formaction = ["'self'"]
  framesrc = ["'self'",
              "https://www.youtube.com"]
  imgsrc = ["'self'",
            "https://*.electricgerbil.art/",
            "data:"]
  objectsrc = ["'none'"]
  connectsrc = ["'self'",
                "https://www.google-analytics.com",
                "https://fonts.googleapis.com",
                "https://fonts.gstatic.com"]
  stylesrc = ["'self'",
              "'unsafe-inline'",
              "https://*.electricgerbil.art/",
              "https://fonts.googleapis.com"]
  mediasrc = ["'self'",
              "https://*.electricgerbil.art/"]
  scriptsrc = ["'self'",
               "'unsafe-inline'",
               "'unsafe-eval'",
               "https://*.electricgerbil.art/",
               "https://www.googletagmanager.com",
               "https://www.google-analytics.com"]

