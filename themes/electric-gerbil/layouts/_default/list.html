{{ define "main" }}
  <section class="container section">
    <h1>{{ .Title }}</h1>
    <div class="simple-list">
      {{ range .Pages.ByDate.Reverse }}
        <a href="{{ .RelPermalink }}">
          <span>{{ .Title }}</span>
          <time>{{ .Date.Format "Jan 2006" }}</time>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
