{{ define "main" }}
  <article class="container section project-single">
    <header class="single-header">
      <h1>{{ .Title }}</h1>
      <p>{{ with .Params.featured_description_short }}{{ . }}{{ else }}{{ .Date.Format "January 2006" }}{{ end }}</p>
    </header>

    <section class="project-content">
      {{ .Content }}
    </section>
  </article>
{{ end }}
